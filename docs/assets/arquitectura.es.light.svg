<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 880" role="img" aria-labelledby="wak-es-t wak-es-d">
<title id="wak-es-t">Cómo llega un mensaje de WhatsApp a tu agente</title>
<desc id="wak-es-d">Flujo de datos: WhatsApp llega al bridge, que guarda mensajes en messages.db. wa-rag indexa opcionalmente en rag.db con embeddings de Ollama en loopback. mcp-server lee ambas bases, descarga media del bridge por 127.0.0.1:8080 y expone 10 tools de solo lectura a tu agente por stdio. Ninguna flecha regresa a WhatsApp.</desc>
