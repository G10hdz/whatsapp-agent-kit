<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 880" role="img" aria-labelledby="wak-en-t wak-en-d">
<title id="wak-en-t">How a WhatsApp message reaches your agent</title>
<desc id="wak-en-d">Data flow: WhatsApp reaches the bridge, which stores messages in messages.db. wa-rag optionally indexes into rag.db with embeddings from Ollama on loopback. mcp-server reads both databases, downloads media from the bridge on 127.0.0.1:8080 and exposes 10 read-only tools to your agent over stdio. No arrow goes back to WhatsApp.</desc>
<defs>
<marker id="arr-dark" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 z" fill="#a8b0c2"/></marker>
</defs>
<rect x="0" y="0" width="560" height="880" fill="#16181f"/>
