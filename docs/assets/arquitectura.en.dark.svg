<path d="M370,166 L516,166 Q524,166 524,174 L524,618 Q524,626 516,626 L388,626" stroke="#a8b0c2" stroke-width="1.6" fill="none" stroke-dasharray="6,5" marker-end="url(#arr-dark)"/>
<path d="M230,666 L230,708" stroke="#a8b0c2" stroke-width="1.6" fill="none" marker-end="url(#arr-dark)"/>
<rect x="120" y="14" width="220" height="72" rx="8" fill="rgba(230,232,238,0.05)" stroke="rgba(230,232,238,0.40)" stroke-width="1.6"/>
<text x="230.0" y="50" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="600" fill="#e6e8ee" text-anchor="middle">WhatsApp</text>
<text x="230.0" y="74" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#a8b0c2" text-anchor="middle">your number</text>
<rect x="90" y="126" width="280" height="80" rx="8" fill="#1e212b" stroke="#e6e8ee" stroke-width="1.6"/>
<text x="230.0" y="162" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="600" fill="#e6e8ee" text-anchor="middle">bridge</text>
<text x="230.0" y="186" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#a8b0c2" text-anchor="middle">Go + whatsmeow · read-only</text>
