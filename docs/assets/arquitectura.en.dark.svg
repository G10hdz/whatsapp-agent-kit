<rect x="60" y="716" width="340" height="92" rx="8" fill="rgba(230,232,238,0.05)" stroke="rgba(230,232,238,0.40)" stroke-width="1.6"/>
<text x="230.0" y="752" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="600" fill="#e6e8ee" text-anchor="middle">Your agent</text>
<text x="230.0" y="776" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#a8b0c2" text-anchor="middle">Claude Code, Codex,</text>
<text x="230.0" y="800" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#a8b0c2" text-anchor="middle">Cursor or a local model</text>
