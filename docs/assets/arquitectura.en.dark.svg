<rect x="50" y="462" width="200" height="96" rx="8" fill="rgba(230,232,238,0.03)" stroke="rgba(230,232,238,0.50)" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="150.0" y="498" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="600" fill="#e6e8ee" text-anchor="middle">rag.db</text>
<text x="150.0" y="522" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#a8b0c2" text-anchor="middle">SQLite</text>
<text x="150.0" y="546" font-family="-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#a8b0c2" text-anchor="middle" font-style="italic">optional</text>
